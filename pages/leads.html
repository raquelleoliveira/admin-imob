<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vitão Corretor — Leads</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link rel="stylesheet" href="../css/app.css" />
</head>

<body>

    <div class="app">

        <aside class="sidebar">

            <div class="sidebar-topo">
                <span class="sidebar-logo">Vitão Corretor</span>
                <button type="button" id="toggle-sidebar" aria-label="Recolher menu"><i
                        class="ti ti-chevrons-left"></i></button>
            </div>

            <nav class="sidebar-menu">
                <a href="home.html" class="menu-item">
                    <span class="menu-icone"><i class="ti ti-home"></i></span>
                    <span class="menu-texto">Home</span>
                </a>
                <a href="imoveis.html" class="menu-item">
                    <span class="menu-icone"><i class="ti ti-building"></i></span>
                    <span class="menu-texto">Imóveis</span>
                </a>
                <a href="proprietarios.html" class="menu-item">
                    <span class="menu-icone"><i class="ti ti-user"></i></span>
                    <span class="menu-texto">Proprietários</span>
                </a>
                <a href="leads.html" class="menu-item ativo">
                    <span class="menu-icone"><i class="ti ti-target-arrow"></i></span>
                    <span class="menu-texto">Leads</span>
                </a>
                <a href="negociacoes.html" class="menu-item">
                    <span class="menu-icone"><i class="ti ti-briefcase"></i></span>
                    <span class="menu-texto">Negociações</span>
                </a>
                <a href="agenda.html" class="menu-item">
                    <span class="menu-icone"><i class="ti ti-calendar"></i></span>
                    <span class="menu-texto">Agenda</span>
                </a>
                <a href="financeiro.html" class="menu-item">
                    <span class="menu-icone"><i class="ti ti-wallet"></i></span>
                    <span class="menu-texto">Financeiro</span>
                </a>
                <a href="configuracoes.html" class="menu-item">
                    <span class="menu-icone"><i class="ti ti-settings"></i></span>
                    <span class="menu-texto">Configurações</span>
                </a>
            </nav>

            <div class="sidebar-rodape">
                <div class="usuario">
                    <div class="usuario-avatar">R</div>
                    <div class="usuario-info">
                        <span class="usuario-nome">Raquelle</span>
                        <span class="usuario-cargo">Administradora</span>
                    </div>
                </div>

                <a href="../index.html" class="menu-item">
                    <span class="menu-icone"><i class="ti ti-logout"></i></span>
                    <span class="menu-texto">Sair</span>
                </a>
            </div>

        </aside>

        <main class="conteudo">
            <header class="topo-pagina">
                <h1>Leads</h1>
                <button type="button" class="btn-secundario">Exportar backup</button>
            </header>

            <section class="card-form">
                <h2>Novo lead</h2>

                <form id="form-lead">
                    <div class="campo">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>

                    <div class="campo">
                        <label for="telefone">Telefone / WhatsApp</label>
                        <input type="tel" id="telefone" name="telefone" required>
                    </div>

                    <div class="campo">
                        <label for="origem">Origem</label>
                        <select id="origem" name="origem">
                            <option value="">Selecione</option>
                            <option value="instagram">Instagram</option>
                            <option value="facebook">Facebook</option>
                            <option value="google">Google</option>
                            <option value="site">Site / Tecimob</option>
                            <option value="whatsapp">WhatsApp</option>
                            <option value="indicacao">Indicação</option>
                            <option value="placa">Placa / rua</option>
                            <option value="outro">Outro</option>
                        </select>
                    </div>

                    <div class="campo escondido" id="campo-origem-outro">
                        <label for="origemOutro">Qual origem?</label>
                        <input type="text" id="origemOutro" name="origemOutro">
                    </div>

                    <div class="campo">
                        <label for="interesse">Interesse</label>
                        <select id="interesse" name="interesse">
                            <option value="comprar">Comprar</option>
                            <option value="alugar">Alugar</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="buscaPor">O que procura</label>
                        <input type="text" id="buscaPor" name="buscaPor" placeholder="Apto 2 dorm no Centro">
                    </div>

                    <div class="campo">
                        <label for="valorMin">Valor mínimo</label>
                        <input type="number" id="valorMin" name="valorMin" min="0">
                    </div>

                    <div class="campo">
                        <label for="valorMax">Valor máximo</label>
                        <input type="number" id="valorMax" name="valorMax" min="0">
                    </div>

                    <div class="campo">
                        <label for="status">Status</label>
                        <select id="status" name="status">
                            <option value="novo">Novo</option>
                            <option value="em-contato">Em contato</option>
                            <option value="visita-agendada">Visita agendada</option>
                            <option value="proposta">Proposta</option>
                            <option value="fechado">Fechado</option>
                            <option value="perdido">Perdido</option>
                        </select>
                    </div>

                    <div class="campo escondido" id="campo-motivo-perda">
                        <label for="motivoPerda">Motivo da perda</label>
                        <input type="text" id="motivoPerda" name="motivoPerda">
                    </div>

                    <div class="campo">
                        <label for="proximoContato">Próximo contato</label>
                        <input type="date" id="proximoContato" name="proximoContato">
                    </div>

                    <div class="campo campo-largo">
                        <label for="observacoes">Observações</label>
                        <textarea id="observacoes" name="observacoes" rows="3"></textarea>
                    </div>

                    <button type="submit" class="btn-primario">Salvar lead</button>
                </form>
            </section>

            <section class="card-lista">
                <h2>Meus leads</h2>

                <table class="tabela-leads">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Telefone</th>
                            <th>Interesse</th>
                            <th>Status</th>
                            <th>Próximo contato</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista-leads">
                        <tr>
                            <td>Mariana Souza</td>
                            <td>(11) 99999-8888</td>
                            <td>Comprar</td>
                            <td><span class="badge status-novo">Novo</span></td>
                            <td>28/10/2026</td>
                            <td>
                                <button type="button" class="btn-icone">Editar</button>
                                <button type="button" class="btn-icone">Excluir</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>

    </div>

    <script src="../js/app.js"></script>
</body>

</html>
